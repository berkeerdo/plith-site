name: Deploy plith.app

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.claudeignore'
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: deploy-plith-app
  cancel-in-progress: false

# Least-privilege token — this workflow reads code and deploys; it doesn't
# write anything back to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # SHA-pinned to guard against a compromised or moved tag on the action.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Uses npm install (not npm ci) on purpose.
        #
        # This site is developed on Windows; Astro and Tailwind both pull in
        # image/CSS native bindings that are OS-specific (rolldown, lightningcss,
        # @tailwindcss/oxide, @napi-rs/*). When the lockfile is generated on
        # Windows, the win32-x64 binding SHAs are recorded and the linux-x64
        # binding is only listed as an optional peer with no version pinned —
        # npm ci on Ubuntu then refuses the tree because a required binding
        # is "missing from lock". Regenerating the lockfile inside a linux
        # container was attempted and left ANOTHER cross-platform gap
        # (dev on Windows would then fail the same way).
        #
        # For a static site with 4 top-level deps (astro, tailwindcss,
        # @astrojs/sitemap, @tailwindcss/vite) the reproducibility trade-off
        # is acceptable: everything is well-known OSS and Cloudflare fronts
        # the origin. Revisit if the dep tree grows or the site starts
        # handling anything sensitive.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Secrets pass through env instead of being spliced into the shell
      # script — avoids GitHub Actions template-injection surface.
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Record the host key up front so we can enforce StrictHostKeyChecking=yes
          # for the actual rsync call instead of blindly trusting whoever answers.
          ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist/ to origin
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_PATH"

      - name: Smoke test
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w "%{http_code}" https://plith.app/)
          echo "https://plith.app/ returned $code"
          test "$code" = "200"
